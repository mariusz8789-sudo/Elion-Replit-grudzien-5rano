name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # The backend suite alone runs 10-14 minutes locally (1,288 tests, several
    # driving real subprocesses). Ten minutes would fail the workflow on time
    # rather than on a defect, which is the least useful kind of red build.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # >= 22.18 is a hard requirement: the reasoning package is TypeScript
          # imported directly by the server, which needs Node's type stripping.
          node-version: '22.18'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests (reasoning, frontend, backend, isolated pass)
        run: npm test

      - name: Typecheck + production build
        run: npm run build

      - name: Build artifact (PR preview)
        uses: actions/upload-artifact@v4
        with:
          name: genesis-dist
          path: packages/frontend/dist
          retention-days: 7

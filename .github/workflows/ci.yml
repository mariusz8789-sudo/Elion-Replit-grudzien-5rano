name: Genesis quality gate

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      - name: Audyt zależności (high/critical)
        run: npm audit --audit-level=high

      - name: Sprawdzenie białych znaków w zmianie
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$PUSH_BEFORE"
          if [ "$EVENT_NAME" = "pull_request" ]; then base="$PR_BASE"; fi
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            git diff --check "$base" "$GITHUB_SHA" -- . ':(exclude,glob)**/*.md' ':(exclude,glob)**/*.markdown'
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD -- . ':(exclude,glob)**/*.md' ':(exclude,glob)**/*.markdown'
          fi

      - name: Lint
        run: npm run lint

      - name: Testy frontend (single worker)
        run: npm run test --workspace=packages/frontend -- --maxWorkers=1

      - name: Testy backend
        run: npm run test --workspace=packages/backend

      - name: Typecheck frontend
        run: npm exec --workspace=packages/frontend -- tsc --noEmit

      - name: Build produkcyjny frontend
        run: npm run build

      - name: Artefakt buildu (podgląd PR)
        uses: actions/upload-artifact@v7
        with:
          name: genesis-os-dist
          path: packages/frontend/dist
          retention-days: 7

  nist-g3-pinned-artifacts:
    name: G3 pinned NIST/CODATA atom-bohr artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fetch and hash official NIST/CODATA artifacts
        env:
          GENESIS_NIST_FIXTURE_DIR: artifacts/atom-bohr-nist
        run: node scripts/fetch-atom-bohr-nist-fixtures.mjs
      - name: Verify manifest and raw payload hashes
        env:
          GENESIS_NIST_FIXTURE_DIR: artifacts/atom-bohr-nist
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { join } from 'node:path';
          const dir = process.env.GENESIS_NIST_FIXTURE_DIR;
          const manifest = JSON.parse(await readFile(join(dir, 'manifest.json'), 'utf8'));
          if (manifest.artifacts.length !== 4) throw new Error('G3 requires exactly A1-A4');
          for (const artifact of manifest.artifacts) {
            const raw = await readFile(join(dir, artifact.file));
            const actual = createHash('sha256').update(raw).digest('hex');
            if (actual !== artifact.sha256) throw new Error(`${artifact.id}: SHA-256 mismatch`);
            console.log(`G3 VERIFIED ${artifact.id} bytes=${raw.byteLength} sha256=${actual}`);
          }
          NODE
      - name: Upload immutable G3 candidate fixture
        uses: actions/upload-artifact@v7
        with:
          name: atom-bohr-nist-g3-${{ github.sha }}
          path: artifacts/atom-bohr-nist
          retention-days: 90

  kepler-solar-system-pinned-artifact:
    name: Kepler anchor — pinned NASA NSSDCA Solar System fact sheet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fetch and hash NASA NSSDCA Planetary Fact Sheet
        env:
          GENESIS_KEPLER_FIXTURE_DIR: artifacts/kepler-solar-system
        run: node scripts/fetch-kepler-solar-system-fixture.mjs
      - name: Verify manifest and raw payload hash
        env:
          GENESIS_KEPLER_FIXTURE_DIR: artifacts/kepler-solar-system
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { join } from 'node:path';
          const dir = process.env.GENESIS_KEPLER_FIXTURE_DIR;
          const manifest = JSON.parse(await readFile(join(dir, 'manifest.json'), 'utf8'));
          if (manifest.artifacts.length !== 1) throw new Error('Kepler fixture requires exactly B1');
          for (const artifact of manifest.artifacts) {
            const raw = await readFile(join(dir, artifact.file));
            const actual = createHash('sha256').update(raw).digest('hex');
            if (actual !== artifact.sha256) throw new Error(`${artifact.id}: SHA-256 mismatch`);
            console.log(`Kepler VERIFIED ${artifact.id} bytes=${raw.byteLength} sha256=${actual}`);
          }
          NODE
      - name: Upload immutable Kepler candidate fixture
        uses: actions/upload-artifact@v7
        with:
          name: kepler-solar-system-${{ github.sha }}
          path: artifacts/kepler-solar-system
          retention-days: 90
      # TEMPORARY DIAGNOSTIC: the uploaded artifact is downloadable only from
      # an Azure blob storage URL, which this repo's own sandbox environment
      # cannot reach (same egress policy that blocks the science-data hosts
      # in the first place) -- so the only way to inspect the REAL fetched
      # page content, rather than guess its table structure blind, is to
      # print it into this job's own log, which the GitHub API does expose.
      # Removed once the real extraction logic is written from this output.
      - name: DIAGNOSTIC — print pinned payload for inspection (removed once extraction logic is written)
        run: cat artifacts/kepler-solar-system/B1-nssdc-planetary-factsheet.html

  docker-image:
    name: Obraz produkcyjny — build i realny smoke test kontenera
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # DLACZEGO TEN JOB ISTNIEJE. `Dockerfile` nigdy nie był budowany w CI —
    # jedyna weryfikacja przed tą misją była ręczna, lokalna, zależna od tego,
    # czy ktoś akurat miał dostęp do Dockera. P0.1-P0.3 tej misji (runtime
    # Node, trwałość danych, tożsamość wydania) są zakodowane W TYM obrazie —
    # `docker build --build-arg GENESIS_COMMIT=...` i cały łańcuch
    # `nodeRuntime.mjs`/`dbDurability.mjs`/`buildInfo.mjs` nie mają żadnego
    # dowodu wykonania na PRAWDZIWYM obrazie kontenerowym, dopóki ten job nie
    # zaistnieje. Runner GitHub Actions ma zwykły dostęp do Docker Hub —
    # sandbox deweloperski, w którym te pliki powstały, miał egress
    # ograniczony do rejestrów pakietów (npm/pypi/crates), więc `docker pull
    # node:22-slim` był tam zablokowany na poziomie CDN (production.
    # cloudfront.docker.com → 403), niezależnie od poprawności samego
    # Dockerfile. Ten job jest więc PIERWSZYM miejscem, gdzie obraz faktycznie
    # się buduje i uruchamia.
    steps:
      - uses: actions/checkout@v7

      - name: Budowa obrazu z realnym identyfikatorem wydania
        run: |
          docker build \
            --build-arg GENESIS_COMMIT=${{ github.sha }} \
            --build-arg GENESIS_BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t genesis-os:ci .

      - name: Realny redeploy drill — kontener + zamontowany wolumin (P0.2, dotąd NOT VERIFIED lokalnie)
        # Tworzy WOLUMEN NAMED (nie bind mount z runnera), uruchamia kontener,
        # tworzy konto przez HTTP, ZABIJA kontener i USUWA go (`docker rm -f`
        # — nie tylko stop), uruchamia NOWY kontener na tym samym woluminie i
        # loguje się tym samym kontem. To jest dokładnie ten scenariusz, który
        # `docs/RISKS.md` R-006 nazywał NOT VERIFIED z braku demona Dockera w
        # sandboxie — tutaj demon jest, więc scenariusz jest wykonywany naprawdę,
        # nie tylko deklarowany.
        run: |
          set -e
          docker volume create genesis-ci-data

          docker run -d --name genesis-a -p 8080:8080 \
            -v genesis-ci-data:/data \
            -e GENESIS_DB_PATH=/data/genesis.db \
            -e ANTHROPIC_API_KEY= \
            genesis-os:ci

          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/api/health > /tmp/health-a.json && break
            sleep 1
          done
          cat /tmp/health-a.json
          node -e "const h=require('/tmp/health-a.json'); if(!h.ok) throw new Error('health not ok'); if(h.commit !== '${{ github.sha }}') throw new Error('commit mismatch: '+h.commit); if(h.db.durability !== 'PERSISTENT') throw new Error('db not persistent: '+h.db.durability); console.log('P0.3 OK: commit', h.commit, 'durability', h.db.durability);"

          TOKEN=$(curl -sf -X POST http://127.0.0.1:8080/api/auth/register \
            -H 'content-type: application/json' \
            -d '{"email":"ci-redeploy-drill@genesis.local","password":"password123"}' | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).token))")
          curl -sf -X POST http://127.0.0.1:8080/api/projects \
            -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d '{"name":"CI redeploy drill"}' > /tmp/project-a.json
          cat /tmp/project-a.json

          # Redeploy: kontener NIE zatrzymany łagodnie — zabity i USUNIĘTY,
          # tak jak orchestrator robi to przy wymianie obrazu.
          docker rm -f genesis-a

          docker run -d --name genesis-b -p 8080:8080 \
            -v genesis-ci-data:/data \
            -e GENESIS_DB_PATH=/data/genesis.db \
            -e ANTHROPIC_API_KEY= \
            genesis-os:ci

          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/api/health > /tmp/health-b.json && break
            sleep 1
          done

          LOGIN=$(curl -sf -X POST http://127.0.0.1:8080/api/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"ci-redeploy-drill@genesis.local","password":"password123"}')
          echo "$LOGIN" > /tmp/login-b.json
          node -e "
            const login = require('/tmp/login-b.json');
            if (login.user.email !== 'ci-redeploy-drill@genesis.local') throw new Error('account did not survive redeploy: ' + JSON.stringify(login));
            console.log('P0.2 OK: account created before redeploy is readable after container replacement + volume remount');
          "
          TOKEN_B=$(node -e "console.log(require('/tmp/login-b.json').token)")
          curl -sf http://127.0.0.1:8080/api/projects -H "authorization: Bearer $TOKEN_B" > /tmp/projects-b.json
          node -e "
            const list = require('/tmp/projects-b.json');
            const found = list.projects.some((p) => p.name === 'CI redeploy drill');
            if (!found) throw new Error('project created before redeploy is missing after it: ' + JSON.stringify(list));
            console.log('P0.2 OK: project created before redeploy is readable after container replacement + volume remount');
          "

          docker rm -f genesis-b
          docker volume rm genesis-ci-data

  pyscf-real:
    name: Real PySCF benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.3'
          cache: pip
          cache-dependency-path: packages/backend/requirements-pyscf.txt
      - name: Install pinned PySCF runtime
        run: python -m pip install --disable-pip-version-check -r packages/backend/requirements-pyscf.txt
      - name: Run real Fabric PySCF contract tests
        env:
          GENESIS_PYSCF_PYTHON: python
        run: node --test packages/backend/src/pyscfFabricApi.test.mjs

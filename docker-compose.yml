# Genesis OS — uruchomienie produkcyjne jednym poleceniem:
#   docker compose up --build
# Aplikacja: http://localhost:8080 (PWA + /api). Klucz AI: plik .env.
services:
  genesis:
    build: .
    ports:
      - '8080:8080'
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GENESIS_AI_MODEL=${GENESIS_AI_MODEL:-claude-opus-4-8}
      - GENESIS_DB_PATH=/app/packages/backend/data/genesis.db
    volumes:
      - genesis-data:/app/packages/backend/data
    restart: unless-stopped

volumes:
  genesis-data:
    name: genesis-data

# Genesis OS — uruchomienie produkcyjne jednym poleceniem:
#   docker compose up --build
# Aplikacja: http://localhost:8080 (PWA + /api). Klucz AI: plik .env.
services:
  genesis:
    build: .
    ports:
      - '8080:8080'
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GENESIS_AI_MODEL=${GENESIS_AI_MODEL:-claude-opus-4-8}
      - GENESIS_DB_PATH=/data/genesis.db
    volumes:
      - genesis-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  genesis-data:
    name: genesis-data

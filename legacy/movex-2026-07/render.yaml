services:
  - type: web
    name: point-to-point
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: point-to-point-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MAPBOX_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

databases:
  - name: point-to-point-db
    plan: starter
